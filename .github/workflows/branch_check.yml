name: 🛡️ Branch Merge Check

on:
  # Pull Request가 열리거나 업데이트될 때마다 이 워크플로우를 실행합니다.
  pull_request:
    types: [opened, synchronize, reopened]
    # main 브랜치로 들어오는 PR에 대해서만 실행하도록 제한합니다.
    branches:
      - main 

jobs:
  check_allowed_source_branch:
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Set Allowed Source Branch
        # main으로 병합이 허용되는 유일한 브랜치를 설정합니다.
        run: echo "ALLOWED_BRANCH=dev" >> $GITHUB_ENV

      - name: 🔍 Check Branch Compliance
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          
          # 정규표현식으로 release/ 또는 hotfix/ 브랜치만 허용
          if [[ "$HEAD_BRANCH" =~ ^release/ || "$HEAD_BRANCH" =~ ^hotfix/ ]]; then
            echo "✅ Branch check passed: $HEAD_BRANCH is allowed to merge into main."
          else
            echo "::error title=Forbidden Merge::Only 'release/*' or 'hotfix/*' branches can be merged into 'main'. Your branch: '$HEAD_BRANCH'"
            exit 1
          fi
