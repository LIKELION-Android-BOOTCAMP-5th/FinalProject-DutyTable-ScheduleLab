name: Build and Test Check

on:
  pull_request:
    branches: [ main, develop ] # main과 develop으로 향하는 PR에서 실행

jobs:
  # 이 'build-and-test'가 Ruleset에 등록한 이름과 일치해야 합니다.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Unit Tests
        run: ./gradlew test
