name: Flutter Build and Test

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Flutter SDK 설치 (최신 안정 버전 사용)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # '3.8.1' 대신 'stable'을 쓰면 Dart 3.8.1 요건을 자동으로 충족합니다.
          cache: true

      # 2. 의존성 패키지 다운로드
      - name: Install dependencies
        run: flutter pub get

      # 3. 정적 분석
      - name: Analyze project
        run: flutter analyze

      # 4. 유닛 테스트 실행
      - name: Run tests
        run: flutter test

      # 5. 안드로이드 빌드 확인
      - name: Build APK
        run: flutter build apk --debug
