name: Flutter Build and Test

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Flutter SDK 설치
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # 프로젝트에 사용 중인 버전으로 수정 가능
          channel: 'stable'
          cache: true

      # 2. 의존성 패키지 다운로드 (pub get)
      - name: Install dependencies
        run: flutter pub get

      # 3. 정적 분석 (Lint 체크 - 선택 사항)
      - name: Analyze project
        run: flutter analyze

      # 4. 유닛 테스트 실행
      - name: Run tests
        run: flutter test

      # 5. 안드로이드 빌드 확인 (APK 생성 테스트)
      - name: Build APK
        run: flutter build apk --debug
